name: Build 🛠️

on:
  pull_request:
    branches: [main, 'codex/stage1-*']

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
          cache-on-failure: true

      - name: Set up Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Format + Clippy
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings --allow dead_code

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Rebuild release extension and test
        run: bash scripts/rebuild.sh --durations=10

      - name: Ruff
        run: uv run --no-sync ruff check --select I .

      - name: Native fixture tests
        run: bash scripts/native.sh test --locked

      - name: Benchmark smoke checks
        run: |
          bash scripts/native.sh bench --locked --bench book -- --test
          uv run --no-sync python -m benchmarks.book --samples 2 --warmups 1 --batches 2 --output target/python-benchmark-smoke.json

      - name: Minimize uv cache
        run: uv cache prune --ci
