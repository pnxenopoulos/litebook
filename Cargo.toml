[package]
name = "litebook-rs"
version = "0.0.1"
edition = "2021"

[lib]
name = "litebook"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
chrono = { version = "0.4.39", features = ["serde"] }
pyo3 = "0.23.4"
serde = { version = "1.0.217", features = ["derive"] }
uuid = { version = "1.12.1", features = ["serde", "v4"] }
